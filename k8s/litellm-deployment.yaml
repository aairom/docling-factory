apiVersion: v1
kind: Service
metadata:
  name: litellm-service
  namespace: docling-factory
  labels:
    app: litellm
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app: litellm

---
apiVersion: v1
kind: Service
metadata:
  name: litellm-db-service
  namespace: docling-factory
  labels:
    app: litellm-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: litellm-db

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-db
  namespace: docling-factory
  labels:
    app: litellm-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-db
  template:
    metadata:
      labels:
        app: litellm-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "litellm"
        - name: POSTGRES_USER
          value: "llmproxy"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: db-password
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - llmproxy
            - -d
            - litellm
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - llmproxy
            - -d
            - litellm
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: litellm-db-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: docling-factory
  labels:
    app: litellm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-latest
        ports:
        - containerPort: 4000
          name: http
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: master-key
        - name: DATABASE_URL
          value: "postgresql://llmproxy:$(DB_PASSWORD)@litellm-db-service:5432/litellm"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: db-password
        # Optional: Add API keys for various providers
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: openai-api-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secrets
              key: anthropic-api-key
              optional: true
        command:
        - litellm
        - --config
        - /app/config.yaml
        - --port
        - "4000"
        - --num_workers
        - "4"
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: config
        configMap:
          name: litellm-config

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-db-pvc
  namespace: docling-factory
  labels:
    app: litellm-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: docling-factory
  labels:
    app: litellm
type: Opaque
stringData:
  master-key: "sk-1234"  # Change this in production!
  db-password: "dbpassword9090"  # Change this in production!
  # Optional: Add your API keys here
  # openai-api-key: "your-openai-key"
  # anthropic-api-key: "your-anthropic-key"

