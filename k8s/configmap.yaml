apiVersion: v1
kind: ConfigMap
metadata:
  name: docling-factory-config
  namespace: docling-factory
  labels:
    app: docling-factory
data:
  # Gradio settings
  GRADIO_SERVER_NAME: "0.0.0.0"
  GRADIO_SERVER_PORT: "7860"
  PYTHONUNBUFFERED: "1"
  
  # RAG settings - OpenSearch
  OPENSEARCH_HOST: "opensearch-service"
  OPENSEARCH_PORT: "9200"
  
  # RAG settings - Ollama (external service)
  # Note: Update this to point to your Ollama service endpoint
  OLLAMA_BASE_URL: "http://ollama-service:11434"
  
  # RAG settings - LiteLLM AI Gateway (optional)
  # Note: Update this to point to your LiteLLM service endpoint
  LITELLM_API_BASE: "http://litellm-service:4000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: docling-factory
  labels:
    app: litellm
data:
  config.yaml: |
    model_list:
      # OpenAI Models (requires OPENAI_API_KEY secret)
      - model_name: gpt-4
        litellm_params:
          model: gpt-4
          api_key: os.environ/OPENAI_API_KEY  # Never hardcode API keys
      
      - model_name: gpt-3.5-turbo
        litellm_params:
          model: gpt-3.5-turbo
          api_key: os.environ/OPENAI_API_KEY  # Never hardcode API keys
      
      - model_name: text-embedding-ada-002
        litellm_params:
          model: text-embedding-ada-002
          api_key: os.environ/OPENAI_API_KEY  # Never hardcode API keys

      # Anthropic Claude (requires ANTHROPIC_API_KEY secret)
      - model_name: claude-3-sonnet
        litellm_params:
          model: claude-3-sonnet-20240229
          api_key: os.environ/ANTHROPIC_API_KEY  # Never hardcode API keys
      
      - model_name: claude-3-opus
        litellm_params:
          model: claude-3-opus-20240229
          api_key: os.environ/ANTHROPIC_API_KEY  # Never hardcode API keys

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY  # REQUIRED: Set via Kubernetes secret
      database_url: os.environ/DATABASE_URL
    
    router_settings:
      routing_strategy: simple-shuffle
      num_retries: 2
      timeout: 600

